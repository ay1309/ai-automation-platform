services:

  postgres:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: automation

    volumes:
      - ./postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always

    ports:
      - "6379:6379"

  python-api:
    build: ./python-api

    container_name: fastapi-backend

    restart: always

    ports:
      - "8000:8000"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    volumes:
      - ./python-api:/app
      - ./documents:/app/documents
      - ./chroma_db:/app/chroma_db

    depends_on:
      - postgres
      - redis