version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: automation

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

    container_name: redis-cache

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-api:
    build:
      context: ./python-api

    container_name: fastapi-backend

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://admin:password@postgres:5432/automation

    volumes:
      - ./python-api:/app
      - ./documents:/app/documents
      - ./chroma_db:/app/chroma_db

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: always

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: automation
      DB_POSTGRESDB_USER: admin
      DB_POSTGRESDB_PASSWORD: password

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/

    depends_on:
      - postgres
      - redis
      - python-api

volumes:
  postgres_data:
  redis_data: