services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: automation

    ports:
      - "5432:5432"

    volumes:
      - ./postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-cache
    restart: always

    ports:
      - "6379:6379"

  python-api:
    build: ./python-api
    container_name: fastapi-backend
    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

  n8n:
    image: n8nio/n8n
    container_name: n8n-server
    restart: always

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: automation
      DB_POSTGRESDB_USER: admin
      DB_POSTGRESDB_PASSWORD: password

    depends_on:
      - postgres
      - redis
      - python-api